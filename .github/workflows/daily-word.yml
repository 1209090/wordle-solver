name: Update daily word

on:
  schedule:
    # The early run may cross midnight while waiting for a runner. The second
    # run is kept away from the busiest first minutes of the hour.
    - cron: '40 23 * * *'
    - cron: '10 0 * * *'
  workflow_dispatch:

# Required to commit back to main, which is served by GitHub Pages.
permissions:
  contents: write

concurrency:
  group: daily-word
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update daily word
        run: node scripts/fetch-daily.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- daily.json; then
            echo "No changes; the daily word is already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git commit -m "Daily word $(date -u +'%d.%m.%y')"
          git push
