name: Update daily word

on:
  schedule:
    # The word changes at 00:00 UTC. GitHub Actions cron jobs can be delayed
    # by tens of minutes, so there are several runs: the first is the regular
    # update and the others catch up if it failed or the API was unavailable.
    - cron: '5 0 * * *'
    - cron: '35 0 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

# Required to commit back to main, which is served by GitHub Pages.
permissions:
  contents: write

concurrency:
  group: daily-word
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update daily word
        run: node scripts/fetch-daily.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- daily.json; then
            echo "No changes; the daily word is already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git commit -m "Daily word $(date -u +'%d.%m.%y')"
          git push
